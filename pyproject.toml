[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resend-ai-model-briefing"
version = "0.1.0"
description = "Generate AI model briefings and deliver them with Resend"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "defusedxml>=0.7,<1",
  "httpx>=0.28,<1",
  "openai>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "resend>=2,<3",
]

[project.scripts]
ai-model-briefing = "ai_model_briefing.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
  "types-pyyaml>=6.0,<7",
  "types-beautifulsoup4>=4.12,<5",
  "types-defusedxml>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_model_briefing"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_model_briefing"]
